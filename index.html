<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova — Powered by MJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="dark">

  <div class="app">

    <!-- Backdrop (mobile/overlay) -->
    <div class="backdrop" id="backdrop"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-name">Nova</span>
          <span class="brand-tag">Powered by <strong>MJ</strong></span>
        </div>
        <button class="icon-btn close-btn" id="closeSidebarBtn" aria-label="Close menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <nav class="mode-switch">
        <button class="mode-btn active" data-mode="chat">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H6l-3 2 1-4.5A8.5 8.5 0 1 1 21 11.5Z"/></svg>
          <span>Chat</span>
        </button>
        <button class="mode-btn" data-mode="image">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>Image</span>
        </button>
      </nav>

      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New conversation</span>
      </button>

      <div class="sidebar-section">
        <p class="sidebar-label">Appearance</p>
        <div class="theme-switch" id="themeSwitch">
          <button class="theme-btn" data-theme="light">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            Light
          </button>
          <button class="theme-btn active" data-theme="dark">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
            Dark
          </button>
          <button class="theme-btn" data-theme="system">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            System
          </button>
        </div>
      </div>

      <button class="report-bug-btn" id="reportBugBtn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
        <span>Report a bug</span>
      </button>

      <div class="sidebar-footer">
        <p>Nova can make mistakes.<br>Check important info.</p>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <button class="icon-btn hamburger-btn" id="openSidebarBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <!-- Chat view -->
      <section class="view chat-view active" id="chatView">
        <div class="messages" id="messages">
          <div class="empty-state">
            <div class="empty-glow"></div>
            <h1>Nova</h1>
            <p>Ask me anything — I'm here to help.</p>
          </div>
        </div>

        <div class="attach-preview" id="attachPreview"></div>

        <div class="composer">
          <div class="composer-inner">
            <input type="file" id="fileInput" accept="image/*" hidden />
            <button id="attachBtn" class="icon-round-btn" aria-label="Attach image" type="button">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 0 1 5.19 5.19l-9.2 9.19a1.83 1.83 0 0 1-2.6-2.6l8.49-8.48"/></svg>
            </button>
            <textarea id="chatInput" placeholder="Message Nova..." rows="1"></textarea>
            <button id="micBtn" class="icon-round-btn" aria-label="Record voice note" type="button">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
            </button>
            <button id="sendBtn" class="send-btn" aria-label="Send">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Image view -->
      <section class="view image-view" id="imageView">
        <div class="image-gallery" id="imageGallery">
          <div class="empty-state">
            <div class="empty-glow"></div>
            <h1>Nova</h1>
            <p>Describe an image and Nova will create it.</p>
          </div>
        </div>

        <div class="composer">
          <div class="composer-inner">
            <textarea id="imageInput" placeholder="Describe the image you want..." rows="1"></textarea>
            <button id="generateBtn" class="send-btn" aria-label="Generate">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </section>

    </main>
  </div>

<script src="js/script.js"></script>
</body>
</html>
